<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1915">
<title>Canggu sun</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1c1915;
    color: #f4efe8;
    font-family: system-ui, -apple-system, sans-serif;
  }
  main {
    width: min(28rem, 100%);
    padding: 2.5rem 1.5rem calc(2.5rem + env(safe-area-inset-bottom));
  }
  h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 650;
  }
  p.when {
    margin: 0.35rem 0 1.75rem;
    color: #b7aa9c;
    font-size: 0.95rem;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 1rem 0;
    border-top: 1px solid #3d352d;
  }
  .label { color: #b7aa9c; font-size: 1rem; }
  .time {
    font-size: 2.4rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
  }
  .miss { color: #e7a3a3; margin: 1rem 0 0; }
</style>
</head>
<body>
<main>
  <h1>Canggu</h1>
  <p class="when" id="when">…</p>
  <div class="row"><span class="label">Sunrise</span><span class="time" id="rise">…</span></div>
  <div class="row"><span class="label">Sunset</span><span class="time" id="set">…</span></div>
  <p class="miss" id="miss" hidden></p>
</main>
<script>
const LAT = -8.6506193;
const LNG = 115.1365007;
const TZ = "Asia/Makassar";

function todayISO() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit"
  }).format(new Date());
}

function clock(iso) {
  return new Intl.DateTimeFormat("en-GB", {
    timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23"
  }).format(new Date(iso));
}

async function load() {
  const when = new Intl.DateTimeFormat("en-GB", {
    timeZone: TZ, day: "numeric", month: "short", year: "numeric"
  }).format(new Date());
  document.getElementById("when").textContent = when + " WITA";
  const day = todayISO();
  const url = "https://api.sunrise-sunset.org/json?lat=" + LAT + "&lng=" + LNG + "&formatted=0&date=" + day;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Sun times did not load");
  const data = await res.json();
  if (!data.results) throw new Error("Sun times did not load");
  document.getElementById("rise").textContent = clock(data.results.sunrise);
  document.getElementById("set").textContent = clock(data.results.sunset);
}

load().catch(function (err) {
  const miss = document.getElementById("miss");
  miss.hidden = false;
  miss.textContent = err.message || "Sun times did not load";
});
</script>
</body>
</html>
